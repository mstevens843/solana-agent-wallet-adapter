<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <title>Agentic Android Feature Graphic</title>
    <style>
      :root {
        --bg: #010606;
        --green: #14f195;
        --cyan: #67e8f9;
        --purple: #8a4cff;
        --text: #f8fbf9;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        background: var(--bg);
        height: 600px;
        margin: 0;
        overflow: hidden;
        width: 1200px;
      }

      body {
        background:
          radial-gradient(circle at 50% 38%, rgba(20, 241, 149, 0.34), transparent 42%),
          radial-gradient(circle at 34% 44%, rgba(103, 232, 249, 0.15), transparent 28%),
          radial-gradient(circle at 67% 50%, rgba(138, 76, 255, 0.14), transparent 32%),
          linear-gradient(135deg, #010303 0%, #032113 48%, #010606 100%);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        position: relative;
      }

      body::before {
        background-image:
          radial-gradient(circle at 4% 56%, rgba(255, 255, 255, 0.62) 0 1.2px, transparent 2px),
          radial-gradient(circle at 9% 19%, rgba(255, 255, 255, 0.42) 0 1px, transparent 2px),
          radial-gradient(circle at 14% 73%, rgba(103, 232, 249, 0.42) 0 1.1px, transparent 2px),
          radial-gradient(circle at 22% 10%, rgba(255, 255, 255, 0.5) 0 1px, transparent 2px),
          radial-gradient(circle at 31% 84%, rgba(255, 255, 255, 0.42) 0 1px, transparent 2px),
          radial-gradient(circle at 43% 13%, rgba(255, 255, 255, 0.62) 0 1.2px, transparent 2px),
          radial-gradient(circle at 51% 67%, rgba(255, 255, 255, 0.42) 0 1px, transparent 2px),
          radial-gradient(circle at 62% 18%, rgba(103, 232, 249, 0.52) 0 1.1px, transparent 2px),
          radial-gradient(circle at 71% 78%, rgba(255, 255, 255, 0.48) 0 1px, transparent 2px),
          radial-gradient(circle at 83% 22%, rgba(255, 255, 255, 0.58) 0 1.2px, transparent 2px),
          radial-gradient(circle at 91% 58%, rgba(255, 255, 255, 0.46) 0 1px, transparent 2px),
          radial-gradient(circle at 97% 83%, rgba(103, 232, 249, 0.42) 0 1.1px, transparent 2px);
        content: "";
        inset: 0;
        opacity: 0.72;
        position: absolute;
      }

      body::after {
        background: radial-gradient(circle at 50% 50%, transparent 56%, rgba(0, 0, 0, 0.68) 100%);
        content: "";
        inset: 0;
        pointer-events: none;
        position: absolute;
      }

      .frame {
        align-items: center;
        display: grid;
        height: 600px;
        justify-items: center;
        padding: 28px 64px 42px;
        position: relative;
        text-align: center;
        z-index: 1;
      }

      .lockup {
        align-items: center;
        display: flex;
        flex-direction: column;
        transform: translateY(-42px);
      }

      .mark-wrap {
        display: grid;
        height: 224px;
        margin-bottom: 0;
        place-items: center;
        position: relative;
        width: 224px;
      }

      .mark-wrap::after {
        background: radial-gradient(circle at 50% 50%, rgba(20, 241, 149, 0.24), rgba(138, 76, 255, 0.14) 36%, transparent 72%);
        border-radius: 999px;
        content: "";
        filter: blur(30px);
        inset: -34px;
        position: absolute;
      }

      .mark {
        filter:
          drop-shadow(0 22px 42px rgba(0, 0, 0, 0.58))
          drop-shadow(0 0 22px rgba(20, 241, 149, 0.2));
        height: 216px;
        object-fit: contain;
        position: relative;
        width: 216px;
        z-index: 1;
      }

      .brand {
        color: var(--text);
        font-size: 60px;
        font-weight: 900;
        letter-spacing: 0.02em;
        line-height: 0.94;
        margin: 0;
        text-shadow: 0 0 28px rgba(255, 255, 255, 0.12);
      }

      .divider {
        background: var(--cyan);
        height: 1px;
        margin: 20px 0 20px;
        opacity: 0.56;
        width: 86px;
      }

      .headline {
        color: #ffffff;
        display: grid;
        gap: 8px;
        font-size: 38px;
        font-weight: 900;
        letter-spacing: 4.7px;
        line-height: 1.04;
        margin: 0;
        text-indent: 4.7px;
        text-shadow: 0 0 22px rgba(20, 241, 149, 0.24);
        text-transform: uppercase;
      }

      .headline .accent {
        color: var(--cyan);
        text-shadow: 0 0 18px rgba(103, 232, 249, 0.48);
      }

    </style>
  </head>
  <body>
    <main class="frame">
      <section class="lockup" aria-label="Agentic Android feature graphic">
        <div class="mark-wrap">
          <img class="mark" src="../../browser-demo/src/assets/logos/saturn_6_cutout.png" alt="" />
        </div>
        <h1 class="brand">Agentic</h1>
        <div class="divider"></div>
        <p class="headline">
          <span>First Solana-native</span>
          <span>Multi-wallet <span class="accent">agent signer</span></span>
        </p>
      </section>
    </main>
  </body>
</html>
