<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1024, initial-scale=1" />
    <title>Agentic Android Feature Graphic (1024x500)</title>
    <style>
      :root {
        --bg: #010606;
        --green: #14f195;
        --cyan: #67e8f9;
        --purple: #8a4cff;
        --signer: #ffffff;
        --text: #f8fbf9;
      }

      * { box-sizing: border-box; }

      html, body {
        background: var(--bg);
        height: 500px;
        margin: 0;
        overflow: hidden;
        width: 1024px;
      }

      body {
        background:
          radial-gradient(circle at 50% 38%, rgba(20, 241, 149, 0.34), transparent 42%),
          radial-gradient(ellipse at 50% 100%, rgba(20, 241, 149, 0.11), transparent 58%),
          radial-gradient(circle at 34% 44%, rgba(103, 232, 249, 0.15), transparent 28%),
          radial-gradient(circle at 67% 50%, rgba(138, 76, 255, 0.14), transparent 32%),
          linear-gradient(135deg, #010303 0%, #032113 48%, #02120c 100%);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        position: relative;
      }

      body::before {
        background-image:
          radial-gradient(circle at 4% 56%, rgba(255, 255, 255, 0.62) 0 1.2px, transparent 2px),
          radial-gradient(circle at 9% 19%, rgba(255, 255, 255, 0.42) 0 1px, transparent 2px),
          radial-gradient(circle at 14% 73%, rgba(103, 232, 249, 0.42) 0 1.1px, transparent 2px),
          radial-gradient(circle at 22% 10%, rgba(255, 255, 255, 0.5) 0 1px, transparent 2px),
          radial-gradient(circle at 31% 84%, rgba(255, 255, 255, 0.42) 0 1px, transparent 2px),
          radial-gradient(circle at 43% 13%, rgba(255, 255, 255, 0.62) 0 1.2px, transparent 2px),
          radial-gradient(circle at 51% 67%, rgba(255, 255, 255, 0.42) 0 1px, transparent 2px),
          radial-gradient(circle at 62% 18%, rgba(103, 232, 249, 0.52) 0 1.1px, transparent 2px),
          radial-gradient(circle at 71% 78%, rgba(255, 255, 255, 0.48) 0 1px, transparent 2px),
          radial-gradient(circle at 83% 22%, rgba(255, 255, 255, 0.58) 0 1.2px, transparent 2px),
          radial-gradient(circle at 91% 58%, rgba(255, 255, 255, 0.46) 0 1px, transparent 2px),
          radial-gradient(circle at 97% 83%, rgba(103, 232, 249, 0.42) 0 1.1px, transparent 2px);
        content: "";
        inset: 0;
        opacity: 0.72;
        position: absolute;
      }

      .frame {
        align-items: center;
        display: grid;
        height: 500px;
        justify-items: center;
        padding: 12px 48px 20px;
        position: relative;
        text-align: center;
        z-index: 1;
      }

      .lockup {
        align-items: center;
        display: flex;
        flex-direction: column;
        transform: translateY(-64px);
      }

      .mark-wrap {
        display: grid;
        height: 360px;
        margin-bottom: -98px;
        place-items: center;
        position: relative;
        width: 360px;
      }

      .mark-wrap::after {
        background: radial-gradient(circle at 50% 50%, rgba(20, 241, 149, 0.24), rgba(138, 76, 255, 0.14) 36%, transparent 72%);
        border-radius: 999px;
        content: "";
        filter: blur(30px);
        inset: -30px;
        position: absolute;
      }

      .mark {
        filter:
          drop-shadow(0 22px 42px rgba(0, 0, 0, 0.58))
          drop-shadow(0 0 22px rgba(20, 241, 149, 0.2));
        height: 340px;
        object-fit: contain;
        position: relative;
        width: 340px;
        z-index: 1;
      }

      .brand {
        color: var(--text);
        font-size: 54px;
        font-weight: 900;
        letter-spacing: 0.02em;
        line-height: 0.94;
        margin: 0;
        text-shadow: 0 0 28px rgba(255, 255, 255, 0.12);
      }

      .divider {
        background: var(--cyan);
        height: 1px;
        margin: 14px 0 14px;
        opacity: 0.56;
        width: 78px;
      }

      .headline {
        color: #ffffff;
        display: grid;
        gap: 6px;
        font-size: 34px;
        font-weight: 900;
        letter-spacing: 4.2px;
        line-height: 1.04;
        margin: 0;
        text-indent: 4.2px;
        text-shadow: 0 0 22px rgba(138, 76, 255, 0.22);
        text-transform: uppercase;
      }

      .headline .accent {
        color: var(--signer);
        text-shadow: 0 0 18px rgba(255, 255, 255, 0.38);
      }
    </style>
  </head>
