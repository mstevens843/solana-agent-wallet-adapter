[package]
name = "solana-agent-wallet-desktop"
version = "0.2.0"
description = "Agentic desktop runtime for Solana Agent Wallet Adapter"
edition = "2021"

[lib]
name = "solana_agent_wallet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
url = "2"
