[package]
name = "solana-agent-wallet-desktop"
version = "0.3.0"
description = "Agentic desktop runtime for Solana Agent Wallet Adapter"
edition = "2021"

[lib]
name = "solana_agent_wallet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
url = "2"

[dev-dependencies]
tempfile = "3"
