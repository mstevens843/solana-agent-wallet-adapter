[package]
name = "solana-agent-wallet-desktop"
version = "0.3.0"
description = "Agentic desktop runtime for Solana Agent Wallet Adapter"
edition = "2021"

[lib]
name = "solana_agent_wallet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
url = "2"

# Embedded wallet crypto (Slice A)
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
bip39 = { version = "2", default-features = false, features = ["std", "rand"] }
bs58 = "0.5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
hmac = "0.12"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
rand = "0.8"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }

# Ledger HID (Slice G)
hidapi = "2"

[dev-dependencies]
tempfile = "3"
