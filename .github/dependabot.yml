version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    target-branch: master
    labels:
      - dependencies
      - security
    groups:
      security-updates:
        applies-to: security-updates
        update-types:
          - patch
          - minor
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: master
    labels:
      - dependencies
      - ci
