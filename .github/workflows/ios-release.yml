name: ios release

on:
  push:
    tags:
      - 'v*-ios'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, for example v0.2.1-ios. Defaults to the current ref.'
        required: true
        type: string
      lane:
        description: 'Fastlane lane to invoke (beta = TestFlight upload; release = App Store submit).'
        required: false
        default: beta
        type: choice
        options:
          - beta
          - release

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  LANE: ${{ github.event_name == 'workflow_dispatch' && inputs.lane || 'beta' }}

jobs:
  ios-release:
    name: iOS build, sign, and TestFlight upload
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v*-ios) ;;
            *) echo "::error::Tag '$RELEASE_TAG' must start with v* and end with -ios"; exit 1 ;;
          esac

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Build web shell + sync iOS project
        env:
          VITE_AGENTIC_DEVICE_AGENT: 'false'
          VITE_AGENTIC_BROWSER_DEVICE_AGENT: 'false'
          VITE_AGENTIC_CLOUD_API_BASE_URL: 'https://agentic-signer.com'
        run: pnpm ios:sync

      - name: Setup Ruby + Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: apps/ios-capacitor

      - name: Decode App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d > ~/.appstoreconnect/private_keys/api_key.p8

      - name: Run fastlane lane
        working-directory: apps/ios-capacitor
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AGENTIC_IOS_VERSION_CODE: ${{ github.run_number }}
          AGENTIC_IOS_VERSION_NAME: ${{ env.RELEASE_TAG }}
          FASTLANE_HIDE_CHANGELOG: '1'
          FASTLANE_SKIP_UPDATE_CHECK: '1'
        run: bundle exec fastlane "$LANE"

      - name: Validate exported IPA
        working-directory: apps/ios-capacitor
        run: |
          test -f build/Agentic.ipa
          test -s build/Agentic.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentic-ios-${{ env.RELEASE_TAG }}
          path: apps/ios-capacitor/build/Agentic.ipa
          if-no-files-found: error
          retention-days: 30

  bridge-tests:
    name: iOS bridge XCTest
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Sync shared fixtures
        run: node packages/ios-capacitor-bridge/scripts/sync-fixtures.mjs
      - name: Resolve Swift packages
        working-directory: packages/ios-capacitor-bridge
        run: swift package resolve
      - name: Run XCTest
        working-directory: packages/ios-capacitor-bridge
        # `swift test` defaults to macOS target; the bridge depends on
        # Capacitor (iOS-only) so the test target needs xcodebuild against a
        # simulator. Documented in README.md.
        run: |
          xcodebuild test \
            -scheme SolanaAgentWalletAdapterIosCapacitorBridge \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -enableCodeCoverage NO \
            CODE_SIGNING_ALLOWED=NO
