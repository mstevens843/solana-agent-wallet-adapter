name: ci

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Supply-chain IoC tripwire
        run: bash scripts/ci-ioc-tripwire.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lockfile dedupe check
        # --config.minimumReleaseAge=0 bypasses the 7-day install floor only for this
        # structural lint; install above still enforces it. Required because pnpm.overrides
        # may pin a version freshly enough to clash with the floor during re-resolution.
        run: pnpm dedupe --check --config.minimumReleaseAge=0

      - name: Audit
        # Blocking: a new advisory fails CI. Pre-existing, triaged advisories are
        # suppressed via pnpm.auditConfig.ignoreCves in package.json (see docs/SECURITY.md
        # "Known unpatched advisories"), so this only trips on something new.
        run: pnpm security:audit

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Install Linux desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libudev-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test desktop runtime
        run: cargo test --manifest-path apps/desktop-shell/src-tauri/Cargo.toml --lib

      - name: Test
        run: pnpm -r test

  osv-scan:
    name: OSV-Scanner
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      scan-args: |-
        --config=./.osv-scanner.toml
        --lockfile=./pnpm-lock.yaml
