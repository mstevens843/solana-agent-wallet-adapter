name: cli-release

on:
  push:
    tags:
      # v1.0+ standardises on `cli-v*` to disambiguate from desktop releases.
      # Legacy `v*` is still recognised so existing v0.2.x tags continue to work.
      - 'cli-v*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish, for example cli-v1.0.0 or v0.2.1'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    name: validate tag against cli package
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - id: check
        shell: bash
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            cli-v*|v*) ;;
            *)
              echo "CLI release tag must start with cli-v or v. Current value: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac
          tag_version="${RELEASE_TAG#cli-v}"
          tag_version="${tag_version#v}"
          package_version="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$package_version" = "$tag_version" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "version=$tag_version" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Legacy v* tags may match the desktop-shell package instead; in that
          # case skip the CLI release gracefully so desktop-release can handle it.
          desktop_version="$(node -p "require('./apps/desktop-shell/package.json').version")"
          if [ "$desktop_version" = "$tag_version" ]; then
            echo "Tag ${RELEASE_TAG} matches desktop-shell ${desktop_version}; CLI release skipped (cli at ${package_version})."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "CLI package version $package_version must match release tag $RELEASE_TAG." >&2
          exit 1

  npm:
    name: publish npm package
    needs: validate
    if: needs.validate.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build CLI package
        run: pnpm -F @solana-agent-wallet-adapter/cli build

      - name: Pack CLI package
        run: pnpm -F @solana-agent-wallet-adapter/cli pack --pack-destination "$RUNNER_TEMP" --json

      - name: Publish CLI to npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Missing NPM_TOKEN repository secret." >&2
            exit 1
          fi
          package_version="$(node -p "require('./packages/cli/package.json').version")"
          if npm view "@solana-agent-wallet-adapter/cli@$package_version" version >/dev/null 2>&1; then
            echo "@solana-agent-wallet-adapter/cli@$package_version already exists on npm; skipping publish."
            exit 0
          fi
          cd packages/cli
          pnpm publish --access public --no-git-checks

  build:
    name: build ${{ matrix.target }}
    needs: validate
    if: needs.validate.outputs.proceed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-15
            binary: packages/cli/dist/standalone/macos-arm64/solana-agent-wallet
            asset: solana-agent-wallet-macos-arm64.tar.gz
          - target: macos-x64
            os: macos-15-intel
            binary: packages/cli/dist/standalone/macos-x64/solana-agent-wallet
            asset: solana-agent-wallet-macos-x64.tar.gz
          - target: linux-x64
            os: ubuntu-latest
            binary: packages/cli/dist/standalone/linux-x64/solana-agent-wallet
            asset: solana-agent-wallet-linux-x64.tar.gz
          - target: windows-x64
            os: windows-latest
            binary: packages/cli/dist/standalone/windows-x64/solana-agent-wallet.exe
            asset: solana-agent-wallet-windows-x64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build CLI package
        run: pnpm -F @solana-agent-wallet-adapter/cli build

      - name: Build standalone binary
        run: pnpm -F @solana-agent-wallet-adapter/cli build:binary:${{ matrix.target }}

      - name: Smoke standalone binary
        run: node packages/cli/scripts/smoke-standalone.mjs "${{ matrix.binary }}"

      - name: Archive Unix asset
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p packages/cli/dist/release
          tar -C "packages/cli/dist/standalone/${{ matrix.target }}" -czf "packages/cli/dist/release/${{ matrix.asset }}" solana-agent-wallet

      - name: Archive Windows asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packages/cli/dist/release | Out-Null
          Compress-Archive -Path "packages/cli/dist/standalone/${{ matrix.target }}/solana-agent-wallet.exe" -DestinationPath "packages/cli/dist/release/${{ matrix.asset }}" -Force

      - name: Upload release asset artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: packages/cli/dist/release/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: publish release assets
    needs:
      - validate
      - build
    if: needs.validate.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-assets/*
          fail_on_unmatched_files: true
