name: desktop release

on:
  push:
    tags:
      # v0.3+ standardises on `desktop-v*` to disambiguate from CLI releases.
      # Legacy `v*` continues to fire so historical tags still work; the validate
      # job below gracefully exits when a v* tag actually belongs to the CLI.
      - 'desktop-v*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, for example desktop-v0.3.0 or v0.2.1.'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    name: validate tag against desktop package
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - id: check
        shell: bash
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            desktop-v*|v*) ;;
            *)
              echo "Desktop release tag must start with desktop-v or v. Current value: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac
          tag_version="${RELEASE_TAG#desktop-v}"
          tag_version="${tag_version#v}"
          desktop_version="$(node -p "require('./apps/desktop-shell/package.json').version")"
          if [ "$desktop_version" = "$tag_version" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cli_version="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$cli_version" = "$tag_version" ]; then
            echo "Tag ${RELEASE_TAG} matches CLI ${cli_version}; desktop release skipped (desktop at ${desktop_version})."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Desktop package version $desktop_version must match release tag $RELEASE_TAG." >&2
          exit 1

  build:
    name: ${{ matrix.name }}
    needs: validate
    if: needs.validate.outputs.proceed == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-15
            rustTarget: aarch64-apple-darwin
            bundle: dmg
            cliAsset: solana-agent-wallet-macos-arm64.tar.gz
            desktopAsset: agentic-desktop-macos-arm64.dmg
            sidecarSuffix: ''
          - name: macos-x64
            runner: macos-15-intel
            rustTarget: x86_64-apple-darwin
            bundle: dmg
            cliAsset: solana-agent-wallet-macos-x64.tar.gz
            desktopAsset: agentic-desktop-macos-x64.dmg
            sidecarSuffix: ''
          - name: windows-x64
            runner: windows-latest
            rustTarget: x86_64-pc-windows-msvc
            bundle: msi
            cliAsset: solana-agent-wallet-windows-x64.zip
            desktopAsset: agentic-desktop-windows-x64.msi
            sidecarSuffix: '.exe'
          - name: linux-x64
            runner: ubuntu-22.04
            rustTarget: x86_64-unknown-linux-gnu
            bundle: appimage
            cliAsset: solana-agent-wallet-linux-x64.tar.gz
            desktopAsset: agentic-desktop-linux-x64.AppImage
            sidecarSuffix: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Validate desktop release version
        shell: bash
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            desktop-v*|v*) ;;
            *)
              echo "Desktop release tag must start with desktop-v or v. Current value: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac
          # Strip either prefix to get the bare semver.
          tag_version="${RELEASE_TAG#desktop-v}"
          tag_version="${tag_version#v}"
          package_version="$(node -p "require('./apps/desktop-shell/package.json').version")"
          if [ "$package_version" != "$tag_version" ]; then
            echo "Desktop package version $package_version must match release tag $RELEASE_TAG." >&2
            exit 1
          fi
          tauri_version="$(node -p "require('./apps/desktop-shell/src-tauri/tauri.conf.json').version")"
          if [ "$tauri_version" != "$tag_version" ]; then
            echo "Tauri version $tauri_version must match release tag $RELEASE_TAG." >&2
            exit 1
          fi
          cargo_version="$(node -e "const fs = require('node:fs'); const text = fs.readFileSync('apps/desktop-shell/src-tauri/Cargo.toml', 'utf8'); console.log(text.match(/^version = \"([^\"]+)\"/m)?.[1] ?? '')")"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "Cargo version $cargo_version must match release tag $RELEASE_TAG." >&2
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTarget }}

      - name: Install Linux Tauri dependencies
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage CLI sidecar
        shell: bash
        run: |
          set -euo pipefail
          work_dir="$RUNNER_TEMP/agentic-sidecar"
          archive="$work_dir/${{ matrix.cliAsset }}"
          extract_dir="$work_dir/extract"
          sidecar_dir="apps/desktop-shell/src-tauri/target/sidecars"
          sidecar_path="$sidecar_dir/agentic-cli-sidecar-${{ matrix.rustTarget }}${{ matrix.sidecarSuffix }}"

          rm -rf "$work_dir"
          mkdir -p "$extract_dir" "$sidecar_dir"

          # Sidecar source order:
          #   1. The explicit CLI release tag for the CLI package version.
          #   2. The current release tag, for legacy v* tags that published CLI and desktop together.
          #   3. Falls through to error after all retries.
          cli_version="$(node -p "require('./packages/cli/package.json').version")"
          cli_release_tag="cli-v${cli_version}"
          cli_release_url="https://github.com/${{ github.repository }}/releases/download/${cli_release_tag}/${{ matrix.cliAsset }}"
          cli_tag_url="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${{ matrix.cliAsset }}"
          downloaded=0
          for attempt in {1..120}; do
            if curl -fL "$cli_release_url" -o "$archive" 2>/dev/null; then
              echo "Fetched CLI sidecar from ${cli_release_tag} release."
              downloaded=1
              break
            fi
            if curl -fL "$cli_tag_url" -o "$archive" 2>/dev/null; then
              echo "Fetched CLI sidecar from ${RELEASE_TAG} release."
              downloaded=1
              break
            fi
            echo "CLI sidecar asset ${{ matrix.cliAsset }} is not available for ${cli_release_tag} or ${RELEASE_TAG} yet; retry ${attempt}/120."
            sleep 15
          done
          if [ "$downloaded" != "1" ]; then
            echo "CLI sidecar asset ${{ matrix.cliAsset }} was not found for ${cli_release_tag} or ${RELEASE_TAG}. Run the CLI release first." >&2
            exit 1
          fi

          case "${{ matrix.cliAsset }}" in
            *.zip)
              if command -v unzip >/dev/null 2>&1; then
                unzip -q "$archive" -d "$extract_dir"
              else
                powershell -NoProfile -Command "Expand-Archive -LiteralPath '$archive' -DestinationPath '$extract_dir' -Force"
              fi
              ;;
            *.tar.gz)
              tar -xzf "$archive" -C "$extract_dir"
              ;;
            *)
              echo "Unsupported CLI sidecar archive: $archive" >&2
              exit 1
              ;;
          esac

          candidate="$(find "$extract_dir" -type f \( -name 'solana-agent-wallet' -o -name 'solana-agent-wallet.exe' \) -print -quit)"
          if [ -z "$candidate" ]; then
            echo "Could not find solana-agent-wallet executable in $archive" >&2
            find "$extract_dir" -maxdepth 3 -type f >&2
            exit 1
          fi

          cp "$candidate" "$sidecar_path"
          chmod +x "$sidecar_path"
          "$sidecar_path" --help

      - name: Typecheck desktop
        run: pnpm -F @solana-agent-wallet-adapter/desktop-shell typecheck

      - name: Build desktop web assets
        run: pnpm -F @solana-agent-wallet-adapter/desktop-shell build

      - name: Test desktop runtime
        run: cargo test --manifest-path apps/desktop-shell/src-tauri/Cargo.toml

      - name: Build Tauri installer
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop-shell
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Agentic ${{ env.RELEASE_TAG }}
          releaseBody: Download the Agentic desktop installer for your platform.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          tauriScript: cargo tauri
          args: --target ${{ matrix.rustTarget }} --bundles ${{ matrix.bundle }} --config src-tauri/tauri.release.conf.json
          assetNamePattern: ${{ matrix.desktopAsset }}
