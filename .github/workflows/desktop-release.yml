name: desktop release

on:
  push:
    tags:
      # v0.3+ standardises on `desktop-v*` to disambiguate from CLI releases.
      # Legacy `v*` continues to fire so historical tags still work; the validate
      # job below gracefully exits when a v* tag actually belongs to the CLI.
      - 'desktop-v*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, for example desktop-v0.3.0 or v0.2.1.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: prepare release tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.normalize.outputs.release_tag }}
      checkout_ref: ${{ steps.normalize.outputs.checkout_ref }}
    steps:
      - id: normalize
        shell: bash
        env:
          RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="${RAW_TAG#refs/tags/}"
          tag="$(printf '%s' "$tag" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
          tag="${tag#tag:}"
          tag="${tag#tag=}"
          tag="$(printf '%s' "$tag" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"

          case "$tag" in
            desktop-v*|v*) ;;
            *)
              echo "Desktop release tag must start with desktop-v or v. Current value: $tag" >&2
              exit 1
              ;;
          esac

          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"

  validate:
    name: validate tag against desktop package
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
      - id: check
        shell: bash
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            desktop-v*|v*) ;;
            *)
              echo "Desktop release tag must start with desktop-v or v. Current value: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac
          tag_version="${RELEASE_TAG#desktop-v}"
          tag_version="${tag_version#v}"
          desktop_version="$(node -p "require('./apps/desktop-shell/package.json').version")"
          if [ "$desktop_version" = "$tag_version" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cli_version="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$cli_version" = "$tag_version" ]; then
            echo "Tag ${RELEASE_TAG} matches CLI ${cli_version}; desktop release skipped (desktop at ${desktop_version})."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Desktop package version $desktop_version must match release tag $RELEASE_TAG." >&2
          exit 1

  build:
    name: ${{ matrix.name }}
    needs:
      - prepare
      - validate
    if: needs.validate.outputs.proceed == 'true'
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-15
            rustTarget: aarch64-apple-darwin
            bundle: dmg
            cliAsset: solana-agent-wallet-macos-arm64.tar.gz
            desktopAsset: agentic-desktop-macos-arm64.dmg
            artifactGlob: apps/desktop-shell/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            sidecarSuffix: ''
          - name: macos-x64
            runner: macos-15-intel
            rustTarget: x86_64-apple-darwin
            bundle: dmg
            cliAsset: solana-agent-wallet-macos-x64.tar.gz
            desktopAsset: agentic-desktop-macos-x64.dmg
            artifactGlob: apps/desktop-shell/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            sidecarSuffix: ''
          - name: windows-x64
            runner: windows-latest
            rustTarget: x86_64-pc-windows-msvc
            bundle: msi
            cliAsset: solana-agent-wallet-windows-x64.zip
            desktopAsset: agentic-desktop-windows-x64.msi
            artifactGlob: apps/desktop-shell/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            sidecarSuffix: '.exe'
          - name: linux-x64
            runner: ubuntu-22.04
            rustTarget: x86_64-unknown-linux-gnu
            bundle: appimage
            cliAsset: solana-agent-wallet-linux-x64.tar.gz
            desktopAsset: agentic-desktop-linux-x64.AppImage
            artifactGlob: apps/desktop-shell/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            sidecarSuffix: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Validate desktop release version
        shell: bash
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            desktop-v*|v*) ;;
            *)
              echo "Desktop release tag must start with desktop-v or v. Current value: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac
          # Strip either prefix to get the bare semver.
          tag_version="${RELEASE_TAG#desktop-v}"
          tag_version="${tag_version#v}"
          package_version="$(node -p "require('./apps/desktop-shell/package.json').version")"
          if [ "$package_version" != "$tag_version" ]; then
            echo "Desktop package version $package_version must match release tag $RELEASE_TAG." >&2
            exit 1
          fi
          tauri_version="$(node -p "require('./apps/desktop-shell/src-tauri/tauri.conf.json').version")"
          if [ "$tauri_version" != "$tag_version" ]; then
            echo "Tauri version $tauri_version must match release tag $RELEASE_TAG." >&2
            exit 1
          fi
          cargo_version="$(node -e "const fs = require('node:fs'); const text = fs.readFileSync('apps/desktop-shell/src-tauri/Cargo.toml', 'utf8'); console.log(text.match(/^version = \"([^\"]+)\"/m)?.[1] ?? '')")"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "Cargo version $cargo_version must match release tag $RELEASE_TAG." >&2
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTarget }}

      - name: Install Linux Tauri dependencies
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libudev-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            dbus-x11 \
            libfuse2 \
            patchelf \
            xvfb

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage CLI sidecar
        shell: bash
        run: |
          set -euo pipefail
          work_dir="$RUNNER_TEMP/agentic-sidecar"
          archive="$work_dir/${{ matrix.cliAsset }}"
          extract_dir="$work_dir/extract"
          sidecar_dir="apps/desktop-shell/src-tauri/target/sidecars"
          sidecar_path="$sidecar_dir/agentic-cli-sidecar-${{ matrix.rustTarget }}${{ matrix.sidecarSuffix }}"

          rm -rf "$work_dir"
          mkdir -p "$extract_dir" "$sidecar_dir"

          # Sidecar source order:
          #   1. The explicit CLI release tag for the CLI package version.
          #   2. The current release tag, for legacy v* tags that published CLI and desktop together.
          #   3. Falls through to error after all retries.
          cli_version="$(node -p "require('./packages/cli/package.json').version")"
          cli_release_tag="cli-v${cli_version}"
          cli_release_url="https://github.com/${{ github.repository }}/releases/download/${cli_release_tag}/${{ matrix.cliAsset }}"
          cli_tag_url="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${{ matrix.cliAsset }}"
          downloaded=0
          for attempt in {1..120}; do
            if curl -fL "$cli_release_url" -o "$archive" 2>/dev/null; then
              echo "Fetched CLI sidecar from ${cli_release_tag} release."
              downloaded=1
              break
            fi
            if curl -fL "$cli_tag_url" -o "$archive" 2>/dev/null; then
              echo "Fetched CLI sidecar from ${RELEASE_TAG} release."
              downloaded=1
              break
            fi
            echo "CLI sidecar asset ${{ matrix.cliAsset }} is not available for ${cli_release_tag} or ${RELEASE_TAG} yet; retry ${attempt}/120."
            sleep 15
          done
          if [ "$downloaded" != "1" ]; then
            echo "CLI sidecar asset ${{ matrix.cliAsset }} was not found for ${cli_release_tag} or ${RELEASE_TAG}. Run the CLI release first." >&2
            exit 1
          fi

          case "${{ matrix.cliAsset }}" in
            *.zip)
              if command -v unzip >/dev/null 2>&1; then
                unzip -q "$archive" -d "$extract_dir"
              else
                powershell -NoProfile -Command "Expand-Archive -LiteralPath '$archive' -DestinationPath '$extract_dir' -Force"
              fi
              ;;
            *.tar.gz)
              tar -xzf "$archive" -C "$extract_dir"
              ;;
            *)
              echo "Unsupported CLI sidecar archive: $archive" >&2
              exit 1
              ;;
          esac

          candidate="$(find "$extract_dir" -type f \( -name 'solana-agent-wallet' -o -name 'solana-agent-wallet.exe' \) -print -quit)"
          if [ -z "$candidate" ]; then
            echo "Could not find solana-agent-wallet executable in $archive" >&2
            find "$extract_dir" -maxdepth 3 -type f >&2
            exit 1
          fi

          cp "$candidate" "$sidecar_path"
          chmod +x "$sidecar_path"
          "$sidecar_path" --help

      - name: Typecheck desktop
        run: pnpm -F @solana-agent-wallet-adapter/desktop-shell typecheck

      - name: Build desktop web assets
        run: pnpm -F @solana-agent-wallet-adapter/desktop-shell build

      - name: Test desktop runtime
        run: cargo test --manifest-path apps/desktop-shell/src-tauri/Cargo.toml

      - name: Validate macOS signing secrets
        if: startsWith(matrix.name, 'macos-')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || secrets.MATCH_KEYCHAIN_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            KEYCHAIN_PASSWORD \
            APP_STORE_CONNECT_API_KEY_BASE64 \
            APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing macOS signing/notarization secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Configure macOS signing and notarization
        if: startsWith(matrix.name, 'macos-')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || secrets.MATCH_KEYCHAIN_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          cert_path="$RUNNER_TEMP/agentic-developer-id.p12"
          keychain_path="$RUNNER_TEMP/agentic-build.keychain-db"
          api_key_dir="$RUNNER_TEMP/appstoreconnect"
          api_key_path="$api_key_dir/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$cert_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security import "$cert_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" \
              | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' \
              | head -n 1
          )"
          if [ -z "$signing_identity" ]; then
            echo "No Developer ID Application signing identity found in imported certificate." >&2
            exit 1
          fi

          mkdir -p "$api_key_dir"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$api_key_path"
          if [ ! -s "$api_key_path" ]; then
            echo "Decoded App Store Connect API key is empty." >&2
            exit 1
          fi
          api_key_size="$(wc -c < "$api_key_path" | tr -d ' ')"
          echo "Selected signing identity: $signing_identity"
          echo "Prepared App Store Connect API key file (${api_key_size} bytes)."

          {
            echo "APPLE_SIGNING_IDENTITY=$signing_identity"
            echo "APPLE_API_KEY=$APP_STORE_CONNECT_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APP_STORE_CONNECT_ISSUER_ID"
            echo "APPLE_API_KEY_PATH=$api_key_path"
          } >> "$GITHUB_ENV"

      - name: Build Tauri installer
        shell: bash
        run: cargo tauri build --target ${{ matrix.rustTarget }} --bundles ${{ matrix.bundle }} --config src-tauri/tauri.release.conf.json
        working-directory: apps/desktop-shell

      - name: Stage desktop artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/desktop
          artifact_glob="${{ matrix.artifactGlob }}"
          shopt -s nullglob
          matches=( $artifact_glob )
          shopt -u nullglob
          if [ "${#matches[@]}" -ne 1 ]; then
            echo "Expected exactly one desktop artifact for glob: $artifact_glob" >&2
            find apps/desktop-shell/src-tauri/target -path '*/release/bundle/*' -type f >&2 || true
            exit 1
          fi
          cp "${matches[0]}" "dist/desktop/${{ matrix.desktopAsset }}"
          ls -lh "dist/desktop/${{ matrix.desktopAsset }}"

      - name: Notarize macOS desktop artifact
        if: startsWith(matrix.name, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          dmg="dist/desktop/${{ matrix.desktopAsset }}"
          submission_output="$RUNNER_TEMP/notarytool-${{ matrix.name }}.json"
          submission_log="$RUNNER_TEMP/notarytool-${{ matrix.name }}-log.json"

          missing=()
          for name in APPLE_API_KEY_PATH APPLE_API_KEY APPLE_API_ISSUER; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing notarization environment variable(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi
          if [ ! -s "$APPLE_API_KEY_PATH" ]; then
            echo "App Store Connect API key file is missing or empty: $APPLE_API_KEY_PATH" >&2
            exit 1
          fi

          fetch_notary_log() {
            local submission_id="$1"
            if [ -z "$submission_id" ]; then
              echo "No notary submission id was found; cannot fetch Apple notary log." >&2
              return 0
            fi
            echo "Fetching Apple notary log for submission $submission_id..." >&2
            xcrun notarytool log "$submission_id" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY" \
              --issuer "$APPLE_API_ISSUER" \
              --output-format json > "$submission_log" 2>&1 || true
            cat "$submission_log" >&2
          }

          echo "Submitting $dmg for Apple notarization..."
          set +e
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait \
            --output-format json > "$submission_output" 2>&1
          submit_status=$?
          set -e
          cat "$submission_output"

          submission_id="$(
            sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$submission_output" | head -n 1
          )"
          notary_status="$(
            sed -n 's/.*"status"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$submission_output" | head -n 1
          )"

          if [ "$submit_status" -ne 0 ]; then
            fetch_notary_log "$submission_id"
            exit "$submit_status"
          fi
          if [ "$notary_status" != "Accepted" ]; then
            echo "Apple notarization did not return Accepted. Status: ${notary_status:-unknown}" >&2
            fetch_notary_log "$submission_id"
            exit 1
          fi

          stapled=0
          for attempt in {1..12}; do
            if xcrun stapler staple "$dmg"; then
              stapled=1
              break
            fi
            echo "Stapling ticket was not available yet; retry ${attempt}/12."
            sleep 10
          done
          if [ "$stapled" != "1" ]; then
            echo "Failed to staple notarization ticket to $dmg." >&2
            exit 1
          fi
          xcrun stapler validate "$dmg"

      - name: Validate macOS desktop artifact
        if: startsWith(matrix.name, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          dmg="dist/desktop/${{ matrix.desktopAsset }}"
          mount_dir="$(mktemp -d "$RUNNER_TEMP/agentic-dmg.XXXXXX")"

          spctl -a -vv -t open --context context:primary-signature "$dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "$dmg"
          cleanup() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          app="$mount_dir/Agentic.app"
          desktop_bin="$app/Contents/MacOS/solana-agent-wallet-desktop"
          sidecar_bin="$app/Contents/MacOS/agentic-cli-sidecar"
          test -d "$app"
          test -x "$desktop_bin"
          test -x "$sidecar_bin"

          codesign --verify --deep --strict --verbose=4 "$app"
          app_signature="$(codesign -dv --verbose=4 "$app" 2>&1)"
          printf '%s\n' "$app_signature"
          printf '%s\n' "$app_signature" | grep -q '^Authority=Developer ID Application:'
          app_team_id="$(printf '%s\n' "$app_signature" | sed -n 's/^TeamIdentifier=//p')"
          if [ -z "$app_team_id" ] || [ "$app_team_id" = "not set" ]; then
            echo "Agentic.app is not signed with a Developer ID team identifier." >&2
            exit 1
          fi

          codesign --verify --strict --verbose=4 "$sidecar_bin"
          sidecar_signature="$(codesign -dv --verbose=4 "$sidecar_bin" 2>&1)"
          printf '%s\n' "$sidecar_signature"
          printf '%s\n' "$sidecar_signature" | grep -q '^Authority=Developer ID Application:'
          sidecar_team_id="$(printf '%s\n' "$sidecar_signature" | sed -n 's/^TeamIdentifier=//p')"
          if [ -z "$sidecar_team_id" ] || [ "$sidecar_team_id" = "not set" ]; then
            echo "CLI sidecar is not signed with a Developer ID team identifier." >&2
            exit 1
          fi

          spctl -a -vvv -t exec "$app"
          xcrun stapler validate "$app" || xcrun stapler validate "$dmg"
          "$sidecar_bin" --help

          cleanup
          trap - EXIT

      - name: Validate Windows desktop artifact
        if: matrix.name == 'windows-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Resolve-Path 'dist/desktop/${{ matrix.desktopAsset }}'
          $signature = Get-AuthenticodeSignature -FilePath $msi
          if ($signature.Status -ne 'Valid') {
            Write-Warning "MSI Authenticode signature status is $($signature.Status). The installer can still be smoke-tested, but Windows publisher trust is not configured."
          }

          $extractDir = Join-Path $env:RUNNER_TEMP 'agentic-msi'
          $log = Join-Path $env:RUNNER_TEMP 'agentic-msi-extract.log'
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/a', $msi, '/qn', "TARGETDIR=$extractDir", "/L*v", $log)
          if ($process.ExitCode -ne 0) {
            Get-Content $log
            throw "MSI administrative extraction failed with exit code $($process.ExitCode)."
          }

          $desktopExe = Get-ChildItem $extractDir -Recurse -Filter 'solana-agent-wallet-desktop.exe' | Select-Object -First 1
          $sidecarExe = Get-ChildItem $extractDir -Recurse -Filter 'agentic-cli-sidecar.exe' | Select-Object -First 1
          if (-not $desktopExe) {
            Get-ChildItem $extractDir -Recurse | Select-Object -ExpandProperty FullName
            throw 'Desktop executable is missing from the MSI.'
          }
          if (-not $sidecarExe) {
            Get-ChildItem $extractDir -Recurse | Select-Object -ExpandProperty FullName
            throw 'CLI sidecar executable is missing from the MSI.'
          }
          & $sidecarExe.FullName --help

      - name: Validate Linux desktop artifact
        if: matrix.name == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          appimage="dist/desktop/${{ matrix.desktopAsset }}"
          chmod +x "$appimage"
          "$appimage" --appimage-version

          extract_dir="$RUNNER_TEMP/agentic-appimage"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          appimage_abs="$GITHUB_WORKSPACE/$appimage"
          (
            cd "$extract_dir"
            "$appimage_abs" --appimage-extract >/tmp/agentic-appimage-extract.log
          )

          root="$extract_dir/squashfs-root"
          test -x "$root/AppRun"
          desktop_bin="$(find "$root" -type f -name 'solana-agent-wallet-desktop' -print -quit)"
          sidecar_bin="$(find "$root" -type f -name 'agentic-cli-sidecar' -print -quit)"
          if [ -z "$desktop_bin" ]; then
            find "$root" -maxdepth 5 -type f | sort >&2
            echo "Desktop executable is missing from the AppImage." >&2
            exit 1
          fi
          if [ -z "$sidecar_bin" ]; then
            find "$root" -maxdepth 5 -type f | sort >&2
            echo "CLI sidecar executable is missing from the AppImage." >&2
            exit 1
          fi
          chmod +x "$desktop_bin" "$sidecar_bin"
          "$sidecar_bin" --help

          set +e
          timeout 15s xvfb-run -a "$root/AppRun" >/tmp/agentic-appimage-launch.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            cat /tmp/agentic-appimage-launch.log >&2
            exit "$status"
          fi

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.desktopAsset }}
          path: dist/desktop/${{ matrix.desktopAsset }}
          if-no-files-found: error

  publish:
    name: publish desktop release assets
    needs:
      - prepare
      - validate
      - build
    if: needs.validate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}

    steps:
      - name: Download validated desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: agentic-desktop-*
          path: dist/desktop
          merge-multiple: true

      - name: Verify desktop artifacts before publish
        shell: bash
        run: |
          set -euo pipefail
          required=(
            agentic-desktop-macos-arm64.dmg
            agentic-desktop-macos-x64.dmg
            agentic-desktop-windows-x64.msi
            agentic-desktop-linux-x64.AppImage
          )
          for asset in "${required[@]}"; do
            path="dist/desktop/$asset"
            if [ ! -s "$path" ]; then
              echo "Missing validated desktop artifact: $asset" >&2
              exit 1
            fi
            ls -lh "$path"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Agentic ${{ env.RELEASE_TAG }}
          body: Download the Agentic desktop installer for your platform.
          files: dist/desktop/agentic-desktop-*
          fail_on_unmatched_files: true
          overwrite_files: true
