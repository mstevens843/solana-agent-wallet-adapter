<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Wallet Standard smoke — solana-agent-wallet-adapter</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        max-width: 720px;
        margin: 40px auto;
        padding: 0 16px;
        line-height: 1.5;
      }
      h1 {
        font-size: 1.4rem;
      }
      button {
        font-size: 1rem;
        padding: 8px 14px;
        margin-right: 8px;
        margin-bottom: 8px;
        cursor: pointer;
      }
      pre {
        background: #f5f5f5;
        padding: 12px;
        border-radius: 6px;
        font-size: 0.85rem;
        white-space: pre-wrap;
        word-break: break-word;
        min-height: 60px;
      }
      .row {
        margin-bottom: 12px;
      }
      .label {
        font-weight: 600;
        margin-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Wallet Standard smoke — solana-agent-wallet-adapter</h1>
    <p>
      Smoke test for <code>@solana-agent-wallet-adapter/wallet-standard-web</code>.
      Have Phantom or Solflare browser extension installed and unlocked, then click the buttons below.
      Cluster is hard-coded to <strong>devnet</strong> so nothing real happens.
    </p>

    <div class="row">
      <button id="list">1. List wallets</button>
      <button id="address">2. Get address</button>
      <button id="sign">3. Sign 'hello' on devnet</button>
    </div>

    <div class="label">Output</div>
    <pre id="out">click a button…</pre>

    <script type="module">
      import {
        listAvailableWallets,
        WalletStandardWebBackend,
      } from './packages/wallet-standard-web/dist/index.js';
      import { SolanaSigningClient } from './packages/core/dist/index.js';

      const out = document.getElementById('out');
      const log = (label, value) => {
        out.textContent =
          label +
          '\n\n' +
          (typeof value === 'string' ? value : JSON.stringify(value, null, 2));
      };

      let cachedClient = null;
      function clientFor(walletEntry) {
        const backend = new WalletStandardWebBackend({
          wallet: walletEntry,
          cluster: 'devnet',
        });
        cachedClient = new SolanaSigningClient({ backend });
        return cachedClient;
      }

      document.getElementById('list').addEventListener('click', () => {
        try {
          const wallets = listAvailableWallets();
          log(
            `Found ${wallets.length} wallet(s):`,
            wallets.map((w) => ({
              name: w.name,
              chains: w.supportedChains,
              features: w.features,
            })),
          );
        } catch (err) {
          log('list error:', err.message ?? String(err));
        }
      });

      document.getElementById('address').addEventListener('click', async () => {
        try {
          const wallets = listAvailableWallets();
          if (wallets.length === 0) {
            log('No wallets registered. Install Phantom or Solflare.', '');
            return;
          }
          const client = clientFor(wallets[0]);
          const address = await client.getAddress();
          log(`address (${wallets[0].name}):`, address);
        } catch (err) {
          log('address error:', err.message ?? String(err));
        }
      });

      document.getElementById('sign').addEventListener('click', async () => {
        try {
          const wallets = listAvailableWallets();
          if (wallets.length === 0) {
            log('No wallets registered. Install Phantom or Solflare.', '');
            return;
          }
          const client = clientFor(wallets[0]);
          const result = await client.signMessage('hello', {
            cluster: 'devnet',
            summary: 'wallet-standard-web smoke test',
          });
          log(`signed by ${wallets[0].name}:`, result);
        } catch (err) {
          log('sign error:', err.message ?? String(err));
        }
      });
    </script>
  </body>
</html>
