# Suppression list for OSV-Scanner CI step.
# Add entries here when an advisory is known-not-reachable in our code paths and
# is tracked in docs/SECURITY.md. New findings (not listed below) should fail CI.

[[IgnoredVulns]]
id = "GHSA-3gc7-fjrx-p6mg"
reason = "bigint-buffer <=1.1.5 toBigIntLE() buffer overflow. Reaches the tree via @kamino-finance/klend-sdk → ... → bigint-buffer; vulnerable code path is binary-layout decoding and is not reachable from agent code. No upstream patch published. Tracked in docs/SECURITY.md under 'Known unpatched advisories'."

[[IgnoredVulns]]
id = "CVE-2025-14505"
reason = "elliptic <=6.6.1 ECDSA nonce handling issue. Reaches the tree through optional cross-chain and legacy EVM SDK dependencies; agent code does not hold user private keys or route user signing through elliptic. No upstream patch published. Tracked in docs/SECURITY.md under 'Known unpatched advisories'."

[[IgnoredVulns]]
id = "CVE-2025-71329"
reason = "image-size <=2.0.2 JXL/HEIF parser infinite-loop DoS. Reaches the tree through React Native / Metro tooling brought by WalletConnect; this project does not expose image-size parsing to untrusted user uploads or network inputs. No upstream patch published. Tracked in docs/SECURITY.md under 'Known unpatched advisories'."

