services:
  - type: web
    name: agentic
    runtime: node
    buildCommand: pnpm install --frozen-lockfile --ignore-scripts && pnpm render:build && pnpm -F @solana-agent-wallet-adapter/render-web build
    startCommand: pnpm -F @solana-agent-wallet-adapter/render-web start
    healthCheckPath: /api/ai/status
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: VITE_AGENTIC_DEV_CONTROLS
        value: "false"
      - key: VITE_AGENTIC_GA_MEASUREMENT_ID
        value: "G-MJ3VZ7VEX7"
