services:
  - type: web
    name: agentic
    runtime: static
    buildCommand: pnpm install --frozen-lockfile --ignore-scripts && pnpm render:prepare && pnpm -F @solana-agent-wallet-adapter/browser-demo build
    staticPublishPath: apps/browser-demo/dist
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
    routes:
      - type: rewrite
        source: "/*"
        destination: /index.html
