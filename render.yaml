databases:
  - name: agentic-postgres
    databaseName: agentic
    user: agentic
    plan: basic-256mb
    ipAllowList: []

# Streaming-session secrets shared between the web service (which encrypts
# delegate secrets at session-open) and the streaming-settlement cron (which
# decrypts them to sign settlements). Both services MUST read identical
# values; setting them as a Render env group keeps them in sync. Set the
# values once in the Render dashboard under "Environment Groups".
envVarGroups:
  - name: agentic-streaming
    envVars:
      - key: STREAMING_SESSION_ENCRYPTION_KEY
        sync: false

services:
  - type: web
    name: agentic
    runtime: node
    buildCommand: pnpm install --frozen-lockfile --ignore-scripts && pnpm render:build
    preDeployCommand: pnpm -F @solana-agent-wallet-adapter/render-web db:migrate
    startCommand: pnpm -F @solana-agent-wallet-adapter/render-web start
    healthCheckPath: /api/ai/status
    domains:
      - agentic-seeker.com
      - agentic-signer.com
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: agentic-postgres
          property: connectionString
      - fromGroup: agentic-streaming
      - key: SESSION_SECRET
        generateValue: true
      - key: AGENTIC_PUBLIC_ORIGIN
        value: "https://agentic-signer.com"
      - key: VITE_AGENTIC_DEV_CONTROLS
        value: "false"
      - key: VITE_AGENTIC_GA_MEASUREMENT_ID
        value: "G-MJ3VZ7VEX7"
      # Evidence-provider operator keys. The cloud `/api/birdeye/*` and
      # `/api/coingecko/*` endpoints are the fall-through path used by Device
      # Agent and any client that does not have the local bridge running. Set
      # the values in the Render dashboard so the keys are not committed.
      - key: BIRDEYE_API_KEY
        sync: false
      - key: COINGECKO_API_KEY
        sync: false
      # Skills marketplace platform fee. TREASURY_WALLET is the Solana pubkey
      # that receives the platform cut of monthly/one-time skill author
      # payments. PLATFORM_FEE_BPS is basis points out of 10000 (1500 = 15%).
      # If TREASURY_WALLET is unset, no cut is taken and skill payments flow
      # 100% to author (current behavior, used for local/staging).
      - key: TREASURY_WALLET
        sync: false
      - key: PLATFORM_FEE_BPS
        sync: false
      # Solana Mobile Seeker ($SKR) ecosystem-token integration. All four
      # vars are optional — when unset, the deployment behaves as if $SKR
      # never existed (web UI, monetization options, streaming sessions all
      # stay USDC-only). Setting SKR_TOKEN_MINT alone unlocks the feature
      # surface; the bounty + session-default flags toggle individual
      # surfaces without touching the others. See
      # `apps/render-web/src/cloud/skrConfig.ts` for the full contract.
      #
      # SKR_TOKEN_MINT: base58 pubkey of the $SKR mint on mainnet. Required
      # to enable any $SKR feature. A malformed value is treated as unset
      # (logged warning), so a typo can't silently misroute installs.
      - key: SKR_TOKEN_MINT
        sync: false
      # SKR_TOKEN_DECIMALS: integer 0–18, defaults to 6. Used by the cloud
      # to split/format $SKR amounts in receipts and recurring schedules.
      - key: SKR_TOKEN_DECIMALS
        sync: false
      # SKR_SKILL_BOUNTY_ACTIVE: literal "true" enables the Android-only
      # author bounty (skills priced in $SKR keep 100% of platform fees).
      # Flip to anything else to end the bootstrap window without changing
      # code; existing schedules retain their original split.
      - key: SKR_SKILL_BOUNTY_ACTIVE
        sync: false
      # SKR_SESSION_DEFAULT: literal "true" makes Android-bundled clients
      # default streaming-session tokenMint to $SKR when omitted. Web
      # clients are never affected; explicit tokenMint always wins.
      - key: SKR_SESSION_DEFAULT
        sync: false
      # User-funded streaming-session delegates: per-session lamports the web
      # service transfers from the user's wallet to the ephemeral delegate at
      # session-open. Default in code is 5_000_000 (0.005 SOL). Override only
      # if you need to widen or tighten that budget.
      # - key: STREAMING_DELEGATE_PREFUND_LAMPORTS
      #   value: "5000000"

  - type: cron
    name: agentic-recurring-materializer
    runtime: node
    schedule: "* * * * *"
    buildCommand: pnpm install --frozen-lockfile --ignore-scripts && pnpm -F @solana-agent-wallet-adapter/render-web build
    startCommand: pnpm -F @solana-agent-wallet-adapter/render-web recurring:materialize
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: agentic-postgres
          property: connectionString

  - type: cron
    name: agentic-recurring-notifications
    runtime: node
    schedule: "* * * * *"
    buildCommand: pnpm install --frozen-lockfile --ignore-scripts && pnpm -F @solana-agent-wallet-adapter/render-web build
    startCommand: pnpm -F @solana-agent-wallet-adapter/render-web notifications:deliver
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: agentic-postgres
          property: connectionString

  # Layer 2 Skills Hub crons. Dev-gated by allowlist inside the executor; safe
  # to run on production with no allowlisted wallets (no-op).
  - type: cron
    name: agentic-skills-execute
    runtime: node
    schedule: "*/5 * * * *"
    buildCommand: pnpm install --frozen-lockfile --ignore-scripts && pnpm -F @solana-agent-wallet-adapter/render-web build
    startCommand: pnpm -F @solana-agent-wallet-adapter/render-web skills:execute
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: agentic-postgres
          property: connectionString

  - type: cron
    name: agentic-aggregator-roll
    runtime: node
    schedule: "*/15 * * * *"
    buildCommand: pnpm install --frozen-lockfile --ignore-scripts && pnpm -F @solana-agent-wallet-adapter/render-web build
    startCommand: pnpm -F @solana-agent-wallet-adapter/render-web aggregator:roll
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: agentic-postgres
          property: connectionString

  - type: cron
    name: agentic-signals-fanout
    runtime: node
    schedule: "* * * * *"
    buildCommand: pnpm install --frozen-lockfile --ignore-scripts && pnpm -F @solana-agent-wallet-adapter/render-web build
    startCommand: pnpm -F @solana-agent-wallet-adapter/render-web signals:fanout
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: agentic-postgres
          property: connectionString

  - type: cron
    name: agentic-streaming-settlement
    runtime: node
    schedule: "* * * * *"
    buildCommand: pnpm install --frozen-lockfile --ignore-scripts && pnpm -F @solana-agent-wallet-adapter/render-web build
    startCommand: pnpm -F @solana-agent-wallet-adapter/render-web streaming:settle
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: agentic-postgres
          property: connectionString
      # Shared with the web service via the `agentic-streaming` env group so
      # the cron can decrypt delegate secrets the web service encrypted.
      - fromGroup: agentic-streaming
