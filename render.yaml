databases:
  - name: agentic-postgres
    databaseName: agentic
    user: agentic
    plan: basic-256mb
    ipAllowList: []

# Streaming-session secrets shared between the web service (which encrypts
# delegate secrets at session-open) and the streaming-settlement cron (which
# decrypts them to sign settlements). Both services MUST read identical
# values; setting them as a Render env group keeps them in sync. Set the
# values once in the Render dashboard under "Environment Groups".
envVarGroups:
  - name: agentic-streaming
    envVars:
      - key: STREAMING_SESSION_ENCRYPTION_KEY
        sync: false

services:
  - type: web
    name: agentic
    runtime: node
    buildCommand: pnpm install --frozen-lockfile --ignore-scripts && pnpm render:build
    preDeployCommand: pnpm -F @solana-agent-wallet-adapter/render-web db:migrate
    startCommand: pnpm -F @solana-agent-wallet-adapter/render-web start
    healthCheckPath: /api/ai/status
    domains:
      - agentic-seeker.com
      - agentic-signer.com
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: agentic-postgres
          property: connectionString
      - fromGroup: agentic-streaming
      - key: SESSION_SECRET
        generateValue: true
      # KEK for hosted BYOK connector API keys (Magic Eden/Tensor/Sanctum/Lulo/
      # Phoenix). Required in production: without it resolveConnectorSecretsKek
      # throws kek_missing and the connector-keys feature is silently disabled
      # (users hit a 503 on save). generateValue produces a stable 32+ char secret.
      - key: CONNECTOR_SECRET_KEY
        generateValue: true
      - key: AGENTIC_PUBLIC_ORIGIN
        value: "https://agentic-signer.com"
      - key: AGENTIC_CLOUD_CORS_ORIGINS
        value: "http://127.0.0.1:5174,http://localhost:5174,https://agentic-signer.com,https://agentic-seeker.com"
      # Plan Connector (Android "use your ChatGPT/Claude plan from your computer"
      # path). Setting this to "1" makes /api/android-config emit
      # bridgePairingEnabled:true (apps/render-web/src/cloud/androidConfig.ts),
      # which the native shell reads to expose the Plan Connector tab + QR
      # pairing in RELEASE builds (debug builds force it on). Server-controlled
      # kill-switch — ships via Render redeploy, no APK rebuild. Requires the
      # published store APK to already contain the native pairing methods
      # (QR scanner + bridge pairing).
      - key: BRIDGE_PAIRING_ENABLED
        value: "1"
      # Device Agent runtime for the Android app surface (on-device AI review +
      # the Plan Connector "use your ChatGPT/Claude plan from your computer"
      # paired-bridge, which is wired on top of the device-agent runtime). The
      # Android app loads this SPA live, so this Vite flag — not the APK's gradle
      # flag — is what gates deviceAgentModeVisible() at runtime. The shipped
      # store build is already the `device-agent` profile
      # (AGENTIC_ANDROID_DEVICE_AGENT=true) with BridgeRelayProvider injected, so
      # turning this on aligns the JS gate with the native runtime already on the
      # device and makes Plan Connector + Device Agent work without an APK
      # rebuild. Scoped to the Android app surface only via isAndroidApp in
      # deviceAgentModeVisibleForSurface(); VITE_AGENTIC_DEVICE_AGENT stays unset
      # so web/iOS are unaffected.
      - key: VITE_AGENTIC_ANDROID_DEVICE_AGENT
        value: "true"
      # Device Agent runtime for the iOS app surface (on-device AI review +
      # the Plan Connector "use your ChatGPT/Claude plan from your computer"
      # paired-bridge). The iOS app loads this SPA live, so this Vite flag —
      # not a frozen binary flag — is what gates the iOS Device Agent + Plan
      # Connector surfaces at runtime. The shipped store binary already bundles
      # AgenticDeviceAgentPlugin, so turning this on aligns the JS gate with the
      # on-device native runtime. To prevent the 2026-06-12 "two flags must
      # agree" class of bug, the JS still AND's this flag with a live
      # capability check (AgenticDeviceAgent.status() / AgenticQrScanner plugin
      # presence) so an old binary never shows a broken control even if this is
      # on. Scoped to the iOS app surface only via isIosApp in
      # deviceAgentModeVisibleForSurface(); VITE_AGENTIC_DEVICE_AGENT stays unset
      # so web/Android are unaffected.
      - key: VITE_AGENTIC_IOS_DEVICE_AGENT
        value: "true"
      - key: VITE_AGENTIC_DEV_CONTROLS
        value: "false"
      - key: VITE_AGENTIC_GA_MEASUREMENT_ID
        value: "G-MJ3VZ7VEX7"
      # Comma list of app surfaces (web,android,ios,desktop) that HIDE the Chat tab
      # and revert to the pre-Chat tab layout. Web + desktop + iOS expose Chat:
      # iOS Plan-Connector chat is pure-JS (WebCrypto relay → desktop /bridge/ai/chat)
      # and iOS cloud chat history syncs via the same /api/chat/* endpoints, so iOS
      # ships via this Render redeploy with no IPA. Android stays gated until the APK
      # with the native RuntimeMethod.CHAT handler ships — its Plan-Connector chat
      # routes through the native device-agent runtime, so an old APK can't forward
      # /bridge/ai/chat. Drop "android" here once that APK is on the Play Store.
      - key: HIDE_CHAT_TAB
        value: "android"
      # Evidence-provider operator keys. The cloud `/api/birdeye/*` and
      # `/api/coingecko/*` endpoints are the fall-through path used by Device
      # Agent and any client that does not have the local bridge running. Set
      # the values in the Render dashboard so the keys are not committed.
      - key: BIRDEYE_API_KEY
        sync: false
      - key: COINGECKO_API_KEY
        sync: false
      # Skills marketplace platform fee. TREASURY_WALLET is the Solana pubkey
      # that receives the platform cut of monthly/one-time skill author
      # payments. PLATFORM_FEE_BPS is basis points out of 10000 (1500 = 15%).
      # If TREASURY_WALLET is unset, no cut is taken and skill payments flow
      # 100% to author (current behavior, used for local/staging).
      - key: TREASURY_WALLET
        sync: false
      - key: PLATFORM_FEE_BPS
        sync: false
      # Solana Mobile Seeker ($SKR) ecosystem-token integration. All four
      # vars are optional — when unset, the deployment behaves as if $SKR
      # never existed (web UI, monetization options, streaming sessions all
      # stay USDC-only). Setting SKR_TOKEN_MINT alone unlocks the feature
      # surface; the bounty + session-default flags toggle individual
      # surfaces without touching the others. See
      # `apps/render-web/src/cloud/skrConfig.ts` for the full contract.
      #
      # SKR_TOKEN_MINT: base58 pubkey of the $SKR mint on mainnet. Required
      # to enable any $SKR feature. A malformed value is treated as unset
      # (logged warning), so a typo can't silently misroute installs.
      - key: SKR_TOKEN_MINT
        sync: false
      # SKR_TOKEN_DECIMALS: integer 0–18, defaults to 6. Used by the cloud
      # to split/format $SKR amounts in receipts and recurring schedules.
      - key: SKR_TOKEN_DECIMALS
        sync: false
      # SKR_SKILL_BOUNTY_ACTIVE: literal "true" enables the Android-only
      # author bounty (skills priced in $SKR keep 100% of platform fees).
      # Flip to anything else to end the bootstrap window without changing
      # code; existing schedules retain their original split.
      - key: SKR_SKILL_BOUNTY_ACTIVE
        sync: false
      # SKR_SESSION_DEFAULT: literal "true" makes Android-bundled clients
      # default streaming-session tokenMint to $SKR when omitted. Web
      # clients are never affected; explicit tokenMint always wins.
      - key: SKR_SESSION_DEFAULT
        sync: false
      # User-funded streaming-session delegates: per-session lamports the web
      # service transfers from the user's wallet to the ephemeral delegate at
      # session-open. Default in code is 5_000_000 (0.005 SOL). Override only
      # if you need to widen or tighten that budget.
      # - key: STREAMING_DELEGATE_PREFUND_LAMPORTS
      #   value: "5000000"

  - type: cron
    name: agentic-recurring-materializer
    runtime: node
    schedule: "* * * * *"
    buildCommand: pnpm install --frozen-lockfile --ignore-scripts && pnpm -F @solana-agent-wallet-adapter/render-web build
    startCommand: pnpm -F @solana-agent-wallet-adapter/render-web recurring:materialize
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: agentic-postgres
          property: connectionString

  - type: cron
    name: agentic-recurring-notifications
    runtime: node
    schedule: "* * * * *"
    buildCommand: pnpm install --frozen-lockfile --ignore-scripts && pnpm -F @solana-agent-wallet-adapter/render-web build
    startCommand: pnpm -F @solana-agent-wallet-adapter/render-web notifications:deliver
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: agentic-postgres
          property: connectionString

  # Layer 2 Skills Hub crons. Dev-gated by allowlist inside the executor; safe
  # to run on production with no allowlisted wallets (no-op).
  - type: cron
    name: agentic-skills-execute
    runtime: node
    schedule: "*/5 * * * *"
    buildCommand: pnpm install --frozen-lockfile --ignore-scripts && pnpm -F @solana-agent-wallet-adapter/render-web build
    startCommand: pnpm -F @solana-agent-wallet-adapter/render-web skills:execute
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: agentic-postgres
          property: connectionString

  - type: cron
    name: agentic-aggregator-roll
    runtime: node
    schedule: "*/15 * * * *"
    buildCommand: pnpm install --frozen-lockfile --ignore-scripts && pnpm -F @solana-agent-wallet-adapter/render-web build
    startCommand: pnpm -F @solana-agent-wallet-adapter/render-web aggregator:roll
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: agentic-postgres
          property: connectionString

  - type: cron
    name: agentic-signals-fanout
    runtime: node
    schedule: "* * * * *"
    buildCommand: pnpm install --frozen-lockfile --ignore-scripts && pnpm -F @solana-agent-wallet-adapter/render-web build
    startCommand: pnpm -F @solana-agent-wallet-adapter/render-web signals:fanout
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: agentic-postgres
          property: connectionString

  - type: cron
    name: agentic-streaming-settlement
    runtime: node
    schedule: "* * * * *"
    buildCommand: pnpm install --frozen-lockfile --ignore-scripts && pnpm -F @solana-agent-wallet-adapter/render-web build
    startCommand: pnpm -F @solana-agent-wallet-adapter/render-web streaming:settle
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: agentic-postgres
          property: connectionString
      # Shared with the web service via the `agentic-streaming` env group so
      # the cron can decrypt delegate secrets the web service encrypted.
      - fromGroup: agentic-streaming
